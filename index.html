
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopEase | Online Store</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f5f6fa;
    color: #222;
}

header {
    background: #171923;
    color: white;
    padding: 20px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
}

.logo {
    font-size: 27px;
    font-weight: bold;
    color: #7c83ff;
}

.cart-button {
    background: #7c83ff;
    border: none;
    padding: 11px 18px;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.hero {
    background: linear-gradient(120deg, #24264b, #656de8);
    color: white;
    text-align: center;
    padding: 65px 20px;
}

.hero h1 {
    font-size: 40px;
    margin-bottom: 15px;
}

.hero p {
    font-size: 17px;
    margin-bottom: 22px;
}

.hero button {
    padding: 12px 25px;
    border: none;
    border-radius: 7px;
    background: white;
    color: #343a8a;
    font-weight: bold;
    cursor: pointer;
}

.container {
    max-width: 1200px;
    margin: 35px auto;
    padding: 0 20px;
}

.section-title {
    text-align: center;
    font-size: 29px;
    margin-bottom: 25px;
}

.controls {
    display: flex;
    gap: 12px;
    justify-content: space-between;
    flex-wrap: wrap;
    margin-bottom: 25px;
}

.controls input,
.controls select {
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 7px;
    background: white;
    flex: 1;
    min-width: 180px;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 22px;
}

.product {
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 15px #00000010;
    transition: 0.3s;
}

.product:hover {
    transform: translateY(-6px);
}

.product-image {
    height: 180px;
    background: #eef0ff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 75px;
}

.product-info {
    padding: 18px;
}

.product-info h3 {
    margin-bottom: 9px;
}

.category {
    color: #777;
    font-size: 13px;
    margin-bottom: 10px;
}

.price {
    color: #565ee0;
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 15px;
}

.add-button {
    background: #565ee0;
    color: white;
    border: none;
    padding: 11px;
    width: 100%;
    border-radius: 7px;
    cursor: pointer;
}

.add-button:hover {
    background: #343a9c;
}

.cart-section {
    background: white;
    border-radius: 12px;
    padding: 25px;
    margin-top: 45px;
    box-shadow: 0 4px 15px #00000010;
}

.cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid #eee;
    padding: 15px 0;
    flex-wrap: wrap;
}

.cart-item button {
    border: none;
    background: #eee;
    padding: 7px 11px;
    border-radius: 5px;
    cursor: pointer;
}

.remove {
    color: #d33;
}

.total {
    text-align: right;
    font-size: 23px;
    font-weight: bold;
    margin-top: 20px;
}

.checkout {
    display: block;
    margin: 20px 0 0 auto;
    padding: 13px 25px;
    background: #171923;
    color: white;
    border: none;
    border-radius: 7px;
    cursor: pointer;
}

.empty {
    color: #888;
    text-align: center;
    padding: 20px;
}

footer {
    margin-top: 50px;
    background: #171923;
    color: white;
    text-align: center;
    padding: 25px;
}

@media(max-width: 600px) {
    .hero h1 {
        font-size: 29px;
    }

    header {
        justify-content: center;
    }

    .cart-item {
        align-items: flex-start;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">ShopEase.</div>
    <button class="cart-button" onclick="scrollToCart()">
        🛒 Cart (<span id="cartCount">0</span>)
    </button>
</header>

<section class="hero">
    <h1>Welcome to ShopEase</h1>
    <p>Discover amazing products at affordable prices.</p>
    <button onclick="document.getElementById('shop').scrollIntoView({behavior:'smooth'})">
        Shop Now
    </button>
</section>

<div class="container" id="shop">
    <h2 class="section-title">Our Products</h2>

    <div class="controls">
        <input type="text" id="search" placeholder="Search products..." oninput="displayProducts()">

        <select id="category" onchange="displayProducts()">
            <option value="All">All Categories</option>
            <option value="Electronics">Electronics</option>
            <option value="Fashion">Fashion</option>
            <option value="Accessories">Accessories</option>
        </select>
    </div>

    <div class="products" id="products"></div>

    <section class="cart-section" id="cart">
        <h2>Your Shopping Cart 🛒</h2>
        <div id="cartItems"></div>
        <div class="total" id="total">Total: Rs. 0</div>
        <button class="checkout" onclick="checkout()">Proceed to Checkout</button>
    </section>
</div>

<footer>
    <p>© 2026 ShopEase. All Rights Reserved.</p>
    <p>Created using HTML, CSS & JavaScript</p>
</footer>

<script>
const products = [
    {id:1, name:"Wireless Headphones", category:"Electronics", price:4500, emoji:"🎧"},
    {id:2, name:"Smart Watch", category:"Electronics", price:6500, emoji:"⌚"},
    {id:3, name:"Running Shoes", category:"Fashion", price:5500, emoji:"👟"},
    {id:4, name:"Men's T-Shirt", category:"Fashion", price:1800, emoji:"👕"},
    {id:5, name:"Backpack", category:"Accessories", price:2500, emoji:"🎒"},
    {id:6, name:"Sunglasses", category:"Accessories", price:1200, emoji:"🕶️"},
    {id:7, name:"Bluetooth Speaker", category:"Electronics", price:3200, emoji:"🔊"},
    {id:8, name:"Sports Cap", category:"Fashion", price:900, emoji:"🧢"}
];

let cart = [];

function displayProducts() {
    const search = document.getElementById("search").value.toLowerCase();
    const category = document.getElementById("category").value;

    const filtered = products.filter(product =>
        product.name.toLowerCase().includes(search) &&
        (category === "All" || product.category === category)
    );

    const container = document.getElementById("products");
    container.innerHTML = "";

    if (filtered.length === 0) {
        container.innerHTML = "<p class='empty'>No products found.</p>";
        return;
    }

    filtered.forEach(product => {
        container.innerHTML += `
            <div class="product">
                <div class="product-image">${product.emoji}</div>
                <div class="product-info">
                    <h3>${product.name}</h3>
                    <p class="category">${product.category}</p>
                    <p class="price">Rs. ${product.price.toLocaleString("en-PK")}</p>
                    <button class="add-button" onclick="addToCart(${product.id})">
                        Add to Cart
                    </button>
                </div>
            </div>
        `;
    });
}

function addToCart(id) {
    const product = products.find(item => item.id === id);
    const existing = cart.find(item => item.id === id);

    if (existing) {
        existing.quantity++;
    } else {
        cart.push({...product, quantity:1});
    }

    displayCart();
}

function changeQuantity(id, amount) {
    const item = cart.find(item => item.id === id);
    if (!item) return;

    item.quantity += amount;

    if (item.quantity <= 0) {
        cart = cart.filter(item => item.id !== id);
    }

    displayCart();
}

function removeItem(id) {
    cart = cart.filter(item => item.id !== id);
    displayCart();
}

function displayCart() {
    const container = document.getElementById("cartItems");
    const count = cart.reduce((sum, item) => sum + item.quantity, 0);
    const total = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);

    document.getElementById("cartCount").textContent = count;
    document.getElementById("total").textContent =
        "Total: Rs. " + total.toLocaleString("en-PK");

    if (cart.length === 0) {
        container.innerHTML = "<p class='empty'>Your cart is empty.</p>";
        return;
    }

    container.innerHTML = cart.map(item => `
        <div class="cart-item">
            <div>
                <strong>${item.emoji} ${item.name}</strong><br>
                Rs. ${item.price.toLocaleString("en-PK")} × ${item.quantity}
            </div>
            <div>
                <button onclick="changeQuantity(${item.id}, -1)">−</button>
                <strong>${item.quantity}</strong>
                <button onclick="changeQuantity(${item.id}, 1)">+</button>
                <button class="remove" onclick="removeItem(${item.id})">Remove</button>
            </div>
        </div>
    `).join("");
}

function scrollToCart() {
    document.getElementById("cart").scrollIntoView({behavior:"smooth"});
}

function checkout() {
    if (cart.length === 0) {
        alert("Your cart is empty! Please add some products.");
        return;
    }

    const total = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);

    alert(
        "Thank you for shopping at ShopEase!\n" +
        "Your order total is Rs. " + total.toLocaleString("en-PK") +
        "\nThis is a demo checkout. No real payment or order is processed."
    );

    cart = [];
    displayCart();
}

displayProducts();
displayCart();
</script>

</body>
</html>
